<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brian's Daily Tennis Log</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1d1d1f; }
  header { background: #1a1a2e; color: white; padding: 28px 36px; }
  header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; }
  header p  { font-size: 13px; color: #888; margin-top: 4px; }
  /* ── Grand summary cards ── */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding: 24px 36px 8px; }
  .card { background: white; border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .card .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: #999; margin-bottom: 6px; }
  .card .value { font-size: 26px; font-weight: 700; }
  .card .sub   { font-size: 11px; color: #aaa; margin-top: 3px; }
  .card.blue   .value { color: #0f3460; }
  .card.green  .value { color: #34c759; }
  .card.red    .value { color: #ff3b30; }
  .card.orange .value { color: #ff9500; }
  /* ── Month sections ── */
  .months { padding: 16px 36px 48px; display: flex; flex-direction: column; gap: 28px; }
  .month-block { background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .month-header {
    background: #1a1a2e; color: white;
    padding: 14px 20px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; user-select: none;
  }
  .month-header h2 { font-size: 15px; font-weight: 700; letter-spacing: 0.2px; }
  .month-header .month-pills { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .pill { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
  .pill.blue   { background: rgba(15,52,96,0.8);  color: #a8d0ff; }
  .pill.green  { background: rgba(52,199,89,0.2); color: #34c759; }
  .pill.red    { background: rgba(255,59,48,0.2); color: #ff6b6b; }
  .chevron { font-size: 12px; color: #888; transition: transform 0.2s; margin-left: 16px; }
  .chevron.open { transform: rotate(180deg); }
  /* ── Month stat bar ── */
  .month-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 0; border-bottom: 1px solid #f0f0f0;
  }
  .stat { padding: 12px 18px; border-right: 1px solid #f0f0f0; }
  .stat:last-child { border-right: none; }
  .stat .s-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #aaa; }
  .stat .s-value { font-size: 17px; font-weight: 700; margin-top: 2px; }
  .stat.pos .s-value { color: #34c759; }
  .stat.neg .s-value { color: #ff3b30; }
  .stat.neu .s-value { color: #0f3460; }
  /* ── Day table ── */
  .month-table { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th {
    background: #f7f8fc; color: #888;
    padding: 9px 14px; text-align: left;
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    border-bottom: 1px solid #eee; white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid #f5f5f5; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafbff; }
  td { padding: 9px 14px; white-space: nowrap; vertical-align: middle; }
  td.date { font-weight: 600; color: #1d1d1f; }
  td.day  { color: #888; font-size: 11px; }
  td.num  { text-align: right; }
  td.pos  { color: #34c759; font-weight: 600; text-align: right; }
  td.neg  { color: #ff3b30; font-weight: 600; text-align: right; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
  .badge.yes-cancel { background: #ffe4e4; color: #c0392b; }
  .badge.no-cancel  { background: #e6f9ee; color: #27ae60; }
  .badge.yes { background: #e6f9ee; color: #27ae60; }
  .badge.no  { background: #f5f5f7; color: #aaa; }
  /* ── Collapsed state ── */
  .month-body { display: block; }
  .month-body.collapsed { display: none; }
  @media (max-width: 600px) {
    .summary { padding: 16px; }
    .months  { padding: 12px 16px 32px; }
    header   { padding: 18px 20px; }
  }
</style>
</head>

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function n(v) { return isNaN(parseFloat(v)) ? 0 : parseFloat(v); }
function fmt$(v) { return v === 0 ? '—' : '$' + v.toLocaleString(); }
function fmtN(v) { return v === 0 ? '—' : v.toLocaleString(); }
function parseRows() {
  const lines = CSV.trim().split('\n').slice(1);
  const seen  = {};
  lines.forEach(line => {
    const c = line.split(',');
    const dateStr = c[1]?.trim();
    if (!dateStr) return;
    seen[dateStr] = {
      date:        dateStr,
      dateObj:     new Date(dateStr),
      lessons:     n(c[2]),
      lessonRev:   n(c[3]),
      cancelled:   c[4]?.trim().toLowerCase() === 'yes',
      cancelCount: n(c[5]),
      junior:      c[6]?.trim().toLowerCase() === 'yes',
      staffCost:   n(c[7]),
      adult:       c[8]?.trim().toLowerCase() === 'yes',
      attendees:   n(c[9]),
      clinicStaff: n(c[10]),
      clinicProfit:n(c[11]),
    };
  });
  return Object.values(seen)
    .filter(r => !isNaN(r.dateObj))
    .sort((a,b) => a.dateObj - b.dateObj);
}
function groupByMonth(rows) {
  const groups = {};
  const order  = [];
  rows.forEach(r => {
    const key = r.dateObj.getFullYear() + '-' + r.dateObj.getMonth();
    if (!groups[key]) {
      groups[key] = {
        label: MONTHS[r.dateObj.getMonth()] + ' ' + r.dateObj.getFullYear(),
        rows: []
      };
      order.push(key);
    }
    groups[key].rows.push(r);
  });
  return order.map(k => groups[k]);
}
function monthTotals(rows) {
  return {
    lessons:     rows.reduce((s,r) => s + r.lessons, 0),
    lessonRev:   rows.reduce((s,r) => s + r.lessonRev, 0),
    cancelCount: rows.reduce((s,r) => s + r.cancelCount, 0),
    attendees:   rows.reduce((s,r) => s + r.attendees, 0),
    clinicIncome:rows.reduce((s,r) => s + r.attendees * 20, 0),
    clinicProfit:rows.reduce((s,r) => s + r.clinicProfit, 0),
    staffCost:   rows.reduce((s,r) => s + r.staffCost, 0),
  };
}
function renderSummaryCards(allRows) {
  const t = monthTotals(allRows);
  const dates = allRows.map(r => r.dateObj);
  const minD  = new Date(Math.min(...dates)).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const maxD  = new Date(Math.max(...dates)).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  document.getElementById('date-range').textContent = minD + ' – ' + maxD;
  document.getElementById('summary').innerHTML = `
    <div class="card blue"><div class="label">Lesson Revenue</div><div class="value">$${t.lessonRev.toLocaleString()}</div><div class="sub">${t.lessons} lessons</div></div>
    <div class="card green"><div class="label">Clinic Income</div><div class="value">$${t.clinicIncome.toLocaleString()}</div><div class="sub">${t.attendees} attendees</div></div>
    <div class="card ${t.clinicProfit >= 0 ? 'green' : 'red'}"><div class="label">Clinic Profit</div><div class="value">$${t.clinicProfit.toLocaleString()}</div><div class="sub">after staff costs</div></div>
    <div class="card orange"><div class="label">Cancellations</div><div class="value">${t.cancelCount}</div><div class="sub">${allRows.filter(r=>r.cancelled).length} days affected</div></div>
    <div class="card"><div class="label">Staff Cost</div><div class="value">$${t.staffCost.toLocaleString()}</div><div class="sub">${allRows.length} days logged</div></div>
  `;
}
function renderMonths(groups) {
  const container = document.getElementById('months');
  container.innerHTML = groups.map((g, gi) => {
    const t = monthTotals(g.rows);
    const profitClass = t.clinicProfit >= 0 ? 'pos' : 'neg';
    const rows = g.rows.map(r => {
      const clinicIncome = r.attendees * 20;
      const pc = r.clinicProfit > 0 ? 'pos' : r.clinicProfit < 0 ? 'neg' : 'num';
      return `<tr>
        <td class="date">${r.date}</td>
        <td class="day">${DAYS[r.dateObj.getDay()]}</td>
        <td class="num">${r.lessons || '—'}</td>
        <td class="num">${r.lessonRev ? '$'+r.lessonRev.toLocaleString() : '—'}</td>
        <td>${r.cancelled ? `<span class="badge yes-cancel">${r.cancelCount} cancelled</span>` : '<span class="badge no-cancel">None</span>'}</td>
        <td><span class="badge ${r.junior ? 'yes' : 'no'}">${r.junior ? 'Yes' : 'No'}</span></td>
        <td class="num">${r.staffCost ? '$'+r.staffCost : '—'}</td>
        <td><span class="badge ${r.adult ? 'yes' : 'no'}">${r.adult ? 'Yes' : 'No'}</span></td>
        <td class="num">${r.attendees || '—'}</td>
        <td class="num">${clinicIncome ? '$'+clinicIncome : '—'}</td>
        <td class="${pc}">${r.clinicProfit !== 0 ? '$'+r.clinicProfit : '—'}</td>
      </tr>`;
    }).join('');
    return `
    <div class="month-block">
      <div class="month-header" onclick="toggle(${gi})">
        <h2>📅 ${g.label}</h2>
        <div class="month-pills">
          <span class="pill blue">${t.lessons} lessons &nbsp;·&nbsp; $${t.lessonRev.toLocaleString()}</span>
          <span class="pill ${t.clinicProfit >= 0 ? 'green' : 'red'}">${t.clinicProfit >= 0 ? '+' : ''}$${t.clinicProfit.toLocaleString()} clinic profit</span>
          ${t.cancelCount ? `<span class="pill red">${t.cancelCount} cancellations</span>` : ''}
        </div>
        <span class="chevron open" id="chev-${gi}">▼</span>
      </div>
      <div class="month-stats">
        <div class="stat neu"><div class="s-label">Lessons</div><div class="s-value">${t.lessons}</div></div>
        <div class="stat neu"><div class="s-label">Lesson Revenue</div><div class="s-value">$${t.lessonRev.toLocaleString()}</div></div>
        <div class="stat neu"><div class="s-label">Attendees</div><div class="s-value">${t.attendees}</div></div>
        <div class="stat neu"><div class="s-label">Clinic Income</div><div class="s-value">$${t.clinicIncome.toLocaleString()}</div></div>
        <div class="stat ${profitClass}"><div class="s-label">Clinic Profit</div><div class="s-value">$${t.clinicProfit.toLocaleString()}</div></div>
        <div class="stat neu"><div class="s-label">Cancellations</div><div class="s-value">${t.cancelCount || '—'}</div></div>
        <div class="stat neu"><div class="s-label">Staff Cost</div><div class="s-value">$${t.staffCost.toLocaleString()}</div></div>
      </div>
      <div class="month-body" id="body-${gi}">
        <div class="month-table">
          <table>
            <thead><tr>
              <th>Date</th><th>Day</th><th>Lessons</th><th>Revenue</th>
              <th>Cancellations</th><th>Junior Clinic</th><th>Staff Cost</th>
              <th>Adult Clinic</th><th>Attendees</th><th>Clinic Income</th><th>Clinic Profit</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  }).join('');
}
function toggle(i) {
  const body = document.getElementById('body-' + i);
  const chev = document.getElementById('chev-' + i);
  body.classList.toggle('collapsed');
  chev.classList.toggle('open');
}
const allRows = parseRows();
const groups  = groupByMonth(allRows);
renderSummaryCards(allRows);
renderMonths(groups);
</script>
</body>
</html>
